name: Refresh pinned playbook

on:
  push:
    branches:
      - gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
    paths:
      - .github/workflows/refresh-playbook.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check out pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keenko-fr/keenko-playbook
          ref: 4801d0401791000c627018dfca5db1b9a68c868a
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook toolchain
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Apply pinned playbook update
        run: bun .bootstrap/playbook/cli/playbook.ts update --target . --apply
      - name: Verify project-owned scaffold preservation
        run: git diff --exit-code -- CONTEXT.md docs/project/architecture.md docs/project/overrides.md docs/project/ui.md
      - name: Check materialized playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .
      - name: Commit refreshed snapshot
        env:
          BRANCH: gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/refresh-playbook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: pin Keenko playbook 4801d040"
          git push origin "HEAD:${BRANCH}"
