name: Bootstrap tooling verification

on:
  push:
    branches:
      - gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
    paths:
      - .github/workflows/bootstrap-tooling.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Format authored files
        run: bun run format
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Run canonical check
        run: bun run check
      - name: Commit bootstrap tooling state
        env:
          BRANCH: gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
        run: |
          rm -f .github/workflows/bootstrap-tooling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: lock bootstrap tooling"
          git push origin "HEAD:${BRANCH}"
