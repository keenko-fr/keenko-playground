name: Repin Playbook

on:
  push:
    branches:
      - gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
    paths:
      - .github/workflows/repin-playbook.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Record Bun runtime
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify lockfile format
        run: |
          grep -F '"lockfileVersion": 2' bun.lock
      - name: Check out pinned Playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keenko-fr/keenko-playbook
          ref: 3e4aef2ed2f01b0296fc1360e4f628a14f9880fc
          path: .bootstrap/playbook
      - name: Install Playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Materialize pinned Playbook
        run: |
          bun .bootstrap/playbook/cli/playbook.ts update --target . --apply
          git diff --name-status
          git diff -- .playbook/docs/core/dependencies.md .playbook/docs/core/tooling.md .playbook/lock.json
          git add .playbook .agents .claude AGENTS.md CLAUDE.md
      - name: Verify second materialization is idempotent
        run: |
          bun .bootstrap/playbook/cli/playbook.ts update --target . --apply
          git diff --exit-code -- .playbook .agents .claude AGENTS.md CLAUDE.md
      - name: Check materialized Playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .
      - name: Remove temporary verification files
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/repin-playbook.yml
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Run canonical check
        run: bun run check
      - name: Audit bootstrap baseline
        run: |
          grep -F '"packageManager": "bun@1.4.0"' package.json
          grep -F 'bun-version: 1.4.0' .github/workflows/check.yml
          grep -F 'Use Bun `>=1.4.0 <2`' README.md
          test -f apps/web/package.json
          test -f packages/backend/package.json
          test "$(find apps/web packages/backend -type f | wc -l)" -eq 2
          if grep -R -F '4801d0401791000c627018dfca5db1b9a68c868a' --exclude-dir=.git --exclude-dir=node_modules .; then
            exit 1
          fi
      - name: Commit rematerialized snapshot
        env:
          BRANCH: gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: rematerialize Playbook 3e4aef2"
          git push origin "HEAD:${BRANCH}"
