name: KEE-4 bootstrap

on:
  push:
    branches:
      - gregorybouteiller/kee-4-keenko-create-restart

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4

      - name: Check out exact Keenko source
        uses: actions/checkout@v4
        with:
          repository: keenko-fr/keenko-playbook
          ref: 3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0
          path: .bootstrap/playbook

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Pack exact Keenko source
        id: pack
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C .bootstrap/playbook rev-parse HEAD)" = "3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0"
          bun --revision
          node --version
          bun install --cwd .bootstrap/playbook --frozen-lockfile
          mkdir -p "${RUNNER_TEMP}/pack" "${RUNNER_TEMP}/repack"
          packed_name="$(cd .bootstrap/playbook && npm pack --pack-destination "${RUNNER_TEMP}/pack" --silent | tail -n 1)"
          repacked_name="$(cd .bootstrap/playbook && npm pack --pack-destination "${RUNNER_TEMP}/repack" --silent | tail -n 1)"
          tarball="${RUNNER_TEMP}/pack/${packed_name}"
          repacked="${RUNNER_TEMP}/repack/${repacked_name}"
          cmp "$tarball" "$repacked"
          sha256sum "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Run canonical create from packed product
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euxo pipefail
          runner="${RUNNER_TEMP}/keenko-runner"
          target="${RUNNER_TEMP}/keenko-playground"
          mkdir -p "$runner"
          cat > "$runner/package.json" <<JSON
          {
            "private": true,
            "dependencies": {
              "keenko": "file:${TARBALL}"
            }
          }
          JSON
          bun install --cwd "$runner"
          cli="$runner/node_modules/keenko/dist/cli/keenko.js"
          test -f "$cli"
          KEENKO_PACKAGE_SPEC="file:${TARBALL}" node "$cli" create "$target"
          test -d "$target/apps/web"
          test -d "$target/packages/backend"
          test -d "$target/packages/ui"
          test -d "$target/packages/shared"
          test ! -e "$target/.playbook"
          bun run --cwd "$target" check

      - name: Reconcile project-owned baseline facts
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euxo pipefail
          target="${RUNNER_TEMP}/keenko-playground"
          artifact="keenko-0.1.0-3b1a2a7.tgz"

          cmp "$target/.github/workflows/ci.yml" .github/workflows/ci.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=.nx "$target/" ./

          mkdir -p vendor/keenko
          cp "$TARBALL" "vendor/keenko/$artifact"
          hash="$(sha256sum "vendor/keenko/$artifact" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "vendor/keenko/$artifact" > vendor/keenko/SHA256SUMS

          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.devDependencies.keenko = "file:vendor/keenko/keenko-0.1.0-3b1a2a7.tgz";
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          cat > README.md <<'EOF'
          # Keenko Playground

          Keenko Playground is the public reference consumer used by KEE-4 to dogfood Keenko with Codex and Claude. Reusable engineering conventions belong to Keenko, not this repository.

          ## Bootstrap baseline

          This restart was created through `keenko create` from Keenko `0.1.0` packed from [`keenko-fr/keenko-playbook` commit `3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0`](https://github.com/keenko-fr/keenko-playbook/commit/3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0), the merge commit for KEE-14 / PR #9.

          Keenko `0.1.0` is not published to npm yet. `vendor/keenko/keenko-0.1.0-3b1a2a7.tgz` is therefore the immutable installation artifact for this baseline. `vendor/keenko/SHA256SUMS` records its integrity, and bootstrap verification reproduces it byte-for-byte from the exact source commit. The tarball is an installation artifact, not a second convention source.

          ## Development

          Follow the generated canonical guidance, especially [dependency and runtime requirements](.keenko/docs/core/dependencies.md), [verification](.keenko/docs/core/verification.md), and the [convention index](.keenko/docs/conventions/README.md).

          ```sh
          bun install --frozen-lockfile
          bun run check
          ```

          Project-specific facts and decisions live in [`CONTEXT.md`](CONTEXT.md) and [`docs/project/`](docs/project/). Generated Keenko guidance and native skill copies are read-only outputs of the Keenko lifecycle.
          EOF

          cat > CONTEXT.md <<'EOF'
          # Project context

          ## Product / domain

          Keenko Playground is the public consumer repository used by KEE-4 to dogfood the Keenko distribution with Codex and Claude. It must remain a consumer and reference implementation, never a second source of reusable Keenko conventions.

          The scored product work uses TVMaze as the authority for external TV metadata. Keenko-owned application state references TVMaze identities rather than duplicating TVMaze as a local catalog. Authentication is outside KEE-4.

          ## Canonical vocabulary

          - **Keenko**: the versioned application distribution produced by `keenko-fr/keenko-playbook`.
          - **Playground**: this consumer repository and dogfood application.
          - **TVMaze ID**: the external identity used to refer to TVMaze shows in Playground-owned state.

          ## Durable facts and constraints

          - The current bootstrap baseline is Keenko `0.1.0`, packed from Playbook merge commit `3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0`.
          - Because that version is not yet published, the exact package artifact is retained under `vendor/keenko/`; its source provenance and SHA-256 are recorded alongside it.
          - Reusable conventions are generated under `.keenko/`. Project-owned files may point to them but must not restate them as local policy.
          - Scored TVMaze feature work starts only after this bootstrap baseline is independently reviewed and frozen.

          ## References

          - `README.md`
          - `docs/project/architecture.md`
          - `docs/project/overrides.md`
          - `docs/project/ui.md`
          EOF

          cat > docs/project/architecture.md <<'EOF'
          # Project architecture

          Playground is a consumer dogfood application for Keenko. This file records only project-specific architecture beyond the generated Keenko defaults.

          For KEE-4 product work, TVMaze is the external metadata authority. External payloads are decoded and normalized at the integration boundary. Playground-owned state is stored through the Keenko backend and refers to TVMaze IDs instead of cloning the external catalog.

          Authentication is out of scope for KEE-4. Do not add product workspaces or domain layers during bootstrap. A later workspace or package must have distinct ownership, a stable API, and real consumers before it is introduced.
          EOF

          cat > docs/project/overrides.md <<'EOF'
          # Project overrides

          No project-specific Keenko convention overrides are active.
          EOF

          cat > docs/project/ui.md <<'EOF'
          # Project UI

          No project-specific UI language is frozen at bootstrap. Use the generated Keenko UI conventions until scored product work establishes durable Playground-specific decisions, then record only those decisions here.
          EOF

          cat > vendor/keenko/SOURCE.md <<EOF
          # Keenko bootstrap artifact

          - Package: \`keenko@0.1.0\`
          - Artifact: \`vendor/keenko/$artifact\`
          - Source repository: \`keenko-fr/keenko-playbook\`
          - Source commit: \`3b1a2a778b40b7b0259c6950f1dc9199d2a8e8c0\`
          - SHA-256: \`$hash\`

          This tarball was produced with \`npm pack\` from the exact source commit after a frozen Playbook install under the KEE-14 reference runtimes. It is retained only because \`keenko@0.1.0\` is not yet published. Do not edit the archive.
          EOF

          rm -f bun.lock
          bun install
          bun run format
          bun run codegen
          sha256sum --check vendor/keenko/SHA256SUMS
          grep -F '"lockfileVersion": 2' bun.lock
          test ! -e .playbook
          test "$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')" = "web "
          test "$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')" = "backend shared ui "
          ! grep -R -E 'TVMaze|tvmaze|watchlist' apps packages

          git add -A
          bun install --frozen-lockfile
          bun run check
          bun run codegen
          git diff --exit-code
          git status --short

      - name: Commit restarted baseline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restart KEE-4 on Keenko 0.1.0"
          git push origin HEAD:gregorybouteiller/kee-4-keenko-create-restart
