name: Bootstrap Playbook

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: write

jobs:
  bootstrap:
    name: Materialize playbook
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gregorybouteiller/kee-4-playground-bootstrap
      - name: Check out pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: keenko-fr/keenko-playbook
          ref: f6fa12d78bafd9719c73bed790179f1bd22f1c8b
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Materialize effect-convex-web
        run: bun .bootstrap/playbook/cli/playbook.ts install --target . --preset effect-convex-web
      - name: Verify materialization
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .
      - name: Remove bootstrap-only files
        run: |
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-playbook.yml
          rm -f .gitkeep
      - name: Commit materialized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: materialize Keenko Playbook"
          git push origin HEAD:gregorybouteiller/kee-4-playground-bootstrap
