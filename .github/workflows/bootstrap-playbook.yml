name: Bootstrap pinned playbook

on:
  push:
    branches:
      - gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
    paths:
      - .github/workflows/bootstrap-playbook.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Checkout pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keenko-fr/keenko-playbook
          ref: f6fa12d78bafd9719c73bed790179f1bd22f1c8b
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook toolchain
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Materialize effect-convex-web preset
        run: bun .bootstrap/playbook/cli/playbook.ts install --target . --preset effect-convex-web
      - name: Verify materialized playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .
      - name: Commit generated scaffold
        env:
          BRANCH: gregorybouteiller/kee-4-dogfood-playbook-in-keenko-playground-with-codex-and-claude
        run: |
          rm -rf .bootstrap
          rm -f .gitkeep
          rm -f .github/workflows/bootstrap-playbook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: install pinned Keenko playbook"
          git push origin "HEAD:${BRANCH}"
