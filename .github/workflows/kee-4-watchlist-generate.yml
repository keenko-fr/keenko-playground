name: Generate KEE-4 watchlist artifacts

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gregorybouteiller/kee-4-playground-bootstrap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run codegen
      - run: bun run format
      - run: bun run check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate watchlist artifacts"
          git push
