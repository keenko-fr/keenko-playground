name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  playbook:
    name: Playbook
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check out pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: keenko-fr/keenko-playbook
          ref: a0cde4eb4138b0c5621036bdd9b29fe0f0a347a3
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Check materialized playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Generate Confect backend
        working-directory: packages/backend
        run: bun run codegen
      - name: Materialize generated dependency state
        if: github.event_name == 'push' && github.ref == 'refs/heads/gregorybouteiller/kee-4-playground-bootstrap'
        run: |
          git add bun.lock packages/backend/confect/_generated packages/backend/convex
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize backend generated state"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Typecheck backend
        working-directory: packages/backend
        run: bun run typecheck
      - name: Test backend
        working-directory: packages/backend
        run: bun test
