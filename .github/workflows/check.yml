name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  playbook:
    name: Playbook
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Check out pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: keenko-fr/keenko-playbook
          ref: f6fa12d78bafd9719c73bed790179f1bd22f1c8b
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Check materialized playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install
      - name: Typecheck backend
        working-directory: packages/backend
        run: bun run typecheck
      - name: Test backend
        working-directory: packages/backend
        run: bun test
