name: KEE-4 React UI migration

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gregorybouteiller/kee-4-playground-bootstrap
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Initialize shadcn Base UI primitives
        working-directory: apps/web
        run: |
          bunx shadcn@latest init --preset base-nova --yes
          bunx shadcn@latest add button card input select table --yes
      - name: Format application-owned source
        run: bun run format
      - name: Commit migration baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web bun.lock
          git diff --cached --stat
          git commit -m "chore: initialize shadcn base ui"
          git push
