name: KEE-4 native Nx bootstrap

on:
  push:
    branches:
      - gregorybouteiller/kee-4-native-nx-restart-pr11

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Playground
        uses: actions/checkout@v5

      - name: Check out exact Keenko source
        uses: actions/checkout@v5
        with:
          repository: keenko-fr/keenko-playbook
          ref: ca0693c86757999d1a2a984da87be629398c4da2
          path: .bootstrap/playbook

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Pack exact Keenko source and start fixture registry
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .bootstrap/playbook rev-parse HEAD)" = "ca0693c86757999d1a2a984da87be629398c4da2"
          bun --revision
          node --version
          bun install --cwd .bootstrap/playbook --frozen-lockfile

          mkdir -p "${RUNNER_TEMP}/pack-a" "${RUNNER_TEMP}/pack-b"
          packed_name="$(cd .bootstrap/playbook && npm pack --pack-destination "${RUNNER_TEMP}/pack-a" --silent | tail -n 1)"
          repacked_name="$(cd .bootstrap/playbook && npm pack --pack-destination "${RUNNER_TEMP}/pack-b" --silent | tail -n 1)"
          tarball="${RUNNER_TEMP}/pack-a/${packed_name}"
          repacked="${RUNNER_TEMP}/pack-b/${repacked_name}"
          cmp "$tarball" "$repacked"
          sha256sum "$tarball"

          state="${RUNNER_TEMP}/registry-state.json"
          TARBALL="$tarball" node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(".bootstrap/playbook/package.json", "utf8"));
          fs.writeFileSync(process.env.RUNNER_TEMP + "/registry-state.json", JSON.stringify({ manifest, packages: { [manifest.version]: process.env.TARBALL } }));
          NODE

          origin_file="${RUNNER_TEMP}/registry-origin.txt"
          bun .bootstrap/playbook/tests/registry-server.ts "$state" > "$origin_file" 2> "${RUNNER_TEMP}/registry-stderr.txt" &
          registry_pid=$!
          for _ in $(seq 1 100); do
            if test -s "$origin_file"; then
              break
            fi
            if ! kill -0 "$registry_pid" 2>/dev/null; then
              cat "${RUNNER_TEMP}/registry-stderr.txt"
              exit 1
            fi
            sleep 0.1
          done
          origin="$(head -n 1 "$origin_file")"
          test -n "$origin"
          echo "BUN_CONFIG_REGISTRY=$origin" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_REGISTRY=$origin" >> "$GITHUB_ENV"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "registry_pid=$registry_pid" >> "$GITHUB_OUTPUT"

      - name: Run exact native Nx create path
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          bunx create-nx-workspace@23.2.0 keenko-playground \
            --preset=keenko \
            --packageManager=bun \
            --nxCloud=skip \
            --interactive=false \
            --trustThirdPartyPreset

          target="${RUNNER_TEMP}/keenko-playground"
          test -d "$target/apps/web"
          test -d "$target/packages/backend"
          test -d "$target/packages/ui"
          test -d "$target/packages/shared"
          test ! -e "$target/.playbook"
          test "$(git -C "$target" symbolic-ref --short HEAD)" = "main"
          ! git -C "$target" rev-parse --verify HEAD >/dev/null 2>&1
          bun run --cwd "$target" check

      - name: Build Playground-owned baseline around canonical output
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/keenko-playground"
          artifact="keenko-0.1.0-ca0693c.tgz"

          cmp "$target/.github/workflows/ci.yml" .github/workflows/ci.yml

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=.nx "$target/" ./

          mkdir -p vendor/keenko
          cp "$TARBALL" "vendor/keenko/$artifact"
          hash="$(sha256sum "vendor/keenko/$artifact" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "vendor/keenko/$artifact" > vendor/keenko/SHA256SUMS

          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.devDependencies.keenko = "file:vendor/keenko/keenko-0.1.0-ca0693c.tgz";
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          cat > README.md <<'EOF'
          # Keenko Playground

          Keenko Playground is the public KEE-4 reference consumer for the Keenko distribution. It is a consumer and dogfood application, not another source of Keenko conventions.

          ## Baseline

          This restart was created from the KEE-14 native Nx lifecycle merged in Playbook PR #11. The exact Playbook source is commit `ca0693c86757999d1a2a984da87be629398c4da2`.

          The source package is still `keenko@0.1.0` and has no GitHub release. This repository therefore retains the exact packed installation artifact at `vendor/keenko/keenko-0.1.0-ca0693c.tgz`. Its source and SHA-256 are recorded beside it. The archive is an installation pin, not convention documentation.

          ## Repository areas

          - `apps/web` is the generated React application boundary.
          - `packages/backend` is the generated Effect, Convex, and Confect backend boundary.
          - `packages/ui` is the generated reusable React UI boundary.
          - `packages/shared` is the generated runtime-neutral shared boundary.

          The bootstrap keeps these areas domain-neutral. The scored TVMaze implementation starts only after this baseline is independently reviewed and frozen.

          ## Working in this repository

          Read `AGENTS.md`, `CONTEXT.md`, `docs/project/`, and the generated `.keenko/` guidance before implementation. Reusable rules belong in Keenko. Playground-specific decisions belong in the project-owned files.

          ```sh
          bun install --frozen-lockfile
          bun x nx sync:check
          bun run check
          ```

          Runtime and tool ownership is defined by `.keenko/docs/core/dependencies.md` and `.keenko/docs/core/tooling.md`. Verification is defined by `.keenko/docs/core/verification.md`.
          EOF

          cat > CONTEXT.md <<'EOF'
          # Project context

          ## Product and domain

          Keenko Playground is the public consumer repository used by KEE-4 to dogfood Keenko with Codex and Claude. It must remain a reference consumer, never a second source of reusable Keenko conventions.

          The scored application uses TVMaze as the authority for external show, season, episode, cast, image, and schedule metadata. Provider JSON is decoded and normalized at the provider boundary. Playground-owned persistence refers to TVMaze identities instead of copying the provider catalog. Authentication is outside KEE-4.

          ## Current bootstrap

          - Keenko package version: `0.1.0`.
          - Exact Playbook source: `ca0693c86757999d1a2a984da87be629398c4da2`, merged by Playbook PR #11 for KEE-14.
          - The unpublished package artifact is pinned under `vendor/keenko/` and used by the root manifest.
          - The initial generated workspaces are `apps/web`, `packages/backend`, `packages/ui`, and `packages/shared`.
          - Scored TVMaze feature work starts only after independent review freezes this baseline.

          ## References

          - `README.md`
          - `docs/project/architecture.md`
          - `docs/project/overrides.md`
          - `docs/project/ui.md`
          EOF

          cat > docs/project/architecture.md <<'EOF'
          # Project architecture

          Playground uses the generated Keenko workspace and boundary model without a local convention fork.

          For KEE-4 product work, TVMaze owns external TV metadata. Decode provider payloads at the integration boundary and normalize them before they cross application boundaries. Convex initially owns only Playground state such as watchlist or curation state plus TVMaze identifiers. Do not persist complete TVMaze show records in the first slice.

          Authentication is outside KEE-4. Do not add another workspace during bootstrap. Later work may add one only for a real ownership or reuse boundary and must use the Keenko Nx tags and dependency rules.
          EOF

          cat > docs/project/overrides.md <<'EOF'
          # Project overrides

          No project-specific Keenko convention overrides are active.
          EOF

          cat > docs/project/ui.md <<'EOF'
          # Project UI

          No Playground-specific visual or interaction language is frozen at bootstrap. Use the generated Keenko UI conventions until scored product work establishes durable project-specific decisions.
          EOF

          cat > vendor/keenko/SOURCE.md <<EOF
          # Keenko bootstrap artifact

          - Package: \`keenko@0.1.0\`
          - Artifact: \`vendor/keenko/$artifact\`
          - Source repository: \`keenko-fr/keenko-playbook\`
          - Source commit: \`ca0693c86757999d1a2a984da87be629398c4da2\`
          - Source PR: \`#11\`
          - SHA-256: \`$hash\`

          The bootstrap runner produced this archive with \`npm pack\` from the exact source commit after a frozen Playbook install under Node 24 and Bun 1.4.0. A second independent pack was byte-identical. Keep this file as installation provenance only.
          EOF

          rm -f bun.lock
          bun install
          bun run format
          bun run codegen

          sha256sum --check vendor/keenko/SHA256SUMS
          grep -F '"lockfileVersion": 2' bun.lock
          grep -F '"keenko": "file:vendor/keenko/keenko-0.1.0-ca0693c.tgz"' package.json
          grep -F '"bun": ">=1.4.0 <2"' package.json
          grep -F '"node": ">=24 <25"' package.json
          grep -F '"packageManager": "bun@1.4.0"' package.json
          test ! -e .playbook
          test "$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')" = "web "
          test "$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')" = "backend shared ui "
          ! grep -R -E 'TVMaze|tvmaze|watchlist' apps packages
          test -f .agents/skills/unslop/SKILL.md
          test -f .claude/skills/unslop/SKILL.md

          git add -A
          bun x nx sync
          git diff --exit-code
          bun run codegen
          git diff --exit-code
          bun run check
          git diff --exit-code
          git diff --cached --stat

      - name: Commit, clean-clone, and push baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: restart KEE-4 on KEE-14 native Nx baseline"

          clean="${RUNNER_TEMP}/clean-playground"
          git clone --quiet --no-local . "$clean"
          sha256sum --check --ignore-missing "$clean/vendor/keenko/SHA256SUMS"
          bun install --cwd "$clean" --frozen-lockfile
          bun run --cwd "$clean" check
          test -z "$(git -C "$clean" status --porcelain)"

          git push origin HEAD:gregorybouteiller/kee-4-native-nx-restart-pr11
