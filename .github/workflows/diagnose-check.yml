name: Diagnose Check

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated code
        run: bun run codegen:check

      - name: Check formatting
        run: bun run format:check

      - name: Capture lint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture tests
        id: test
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee test.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: repository-diagnostics
          path: |
            lint.log
            typecheck.log
            test.log

      - name: Fail on diagnostics
        shell: bash
        run: |
          test "${{ steps.lint.outputs.status }}" = "0"
          test "${{ steps.typecheck.outputs.status }}" = "0"
          test "${{ steps.test.outputs.status }}" = "0"
