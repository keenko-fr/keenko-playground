name: Diagnose Check

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated code
        run: bun run codegen:check

      - name: Check formatting
        run: bun run format:check

      - name: Capture lint diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log

      - name: Fail on lint diagnostics
        run: exit "${{ steps.lint.outputs.status }}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
