name: Update KEE-4 playbook

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap
    paths:
      - .github/workflows/kee-4-playbook-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gregorybouteiller/kee-4-playground-bootstrap
      - name: Check out latest pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: keenko-fr/keenko-playbook
          ref: d6df73cc43f6bfba5e23271994824c397735f03c
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Apply playbook update
        run: bun .bootstrap/playbook/cli/playbook.ts update --target . --apply
      - name: Verify updated playbook
        run: bun .bootstrap/playbook/cli/playbook.ts check --target .
      - name: Verify repository
        run: |
          bun install --frozen-lockfile
          bun run check
      - name: Commit materialized update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .playbook .agents .claude AGENTS.md CLAUDE.md docs/project/ui.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: materialize latest playbook"
          git push
