name: KEE-4 Playbook refresh

on:
  push:
    branches:
      - gregorybouteiller/kee-4-playground-bootstrap

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out playground
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gregorybouteiller/kee-4-playground-bootstrap
      - name: Check out pinned playbook
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: keenko-fr/keenko-playbook
          ref: 4801d0401791000c627018dfca5db1b9a68c868a
          path: .bootstrap/playbook
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install playbook dependencies
        working-directory: .bootstrap/playbook
        run: bun install --frozen-lockfile
      - name: Apply and verify playbook update
        run: |
          bun .bootstrap/playbook/cli/playbook.ts update --target . --apply
          bun .bootstrap/playbook/cli/playbook.ts check --target .
          rm -rf .bootstrap/playbook
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Apply safe lint fixes and canonical formatting
        run: |
          bun run lint:fix || true
          bun run format
      - name: Commit migration output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .playbook .agents .claude AGENTS.md CLAUDE.md apps packages scripts oxlint.config.ts oxfmt.config.ts package.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical lint migration"
          git push
